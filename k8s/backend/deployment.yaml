apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsge-backend
  namespace: rsge
  labels:
    app: rsge-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsge-backend
  template:
    metadata:
      labels:
        app: rsge-backend
    spec:
      containers:
        - name: backend
          image: REGISTRY_IMAGE/backend:IMAGE_TAG  # mis à jour par CI
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: rsge-backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rsge-backend-secret
                  key:  DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "256Mi"
      imagePullSecrets:
        - name: gitlab-registry-secret
